
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<title>Optimale Bestellanzahl</title>
		
		<script>
			"use strict";
			function fOptimaleMenge() {

				var vAusgabeHtml="";
                var vOptBestellanzahlProJahr
				var vBestellkostenProBestellung;
				var vLagerkostenProDrucker;
				var vJaehrlicheBestellmenge;
				// Ergänze die fehlenden Variabalen
				var i = 1;  //vBestellanzahl;
                var vBestellkosten = vBestellkostenProBestellung * i //vBestellanzahl;
                var vGesamtkosten = vBestellkosten + vLagerkosten;;
				var vLagerkosten = vLagerkostenProDrucker * vBestellmenge;
                var vBestellmenge = vJaehrlicheBestellmenge / i //vBestellanzahl;


				vBestellkostenProBestellung = document.getElementById("idBestellkostenProBestellung").value;
				vLagerkostenProDrucker = document.getElementById("idLagerkostenProDrucker").value;
				vJaehrlicheBestellmenge = document.getElementById("idJaehrlicheBestellmenge").value;
				vAusgabeHtml += "<table border=1>";
                vAusgabeHtml += "<tr><th>Bestellanzahl im Jahr</th><th>Bestellmenge in Stk.</th><th>Bestellkosten in €</th><th>Lagerkosten in €</th><th>Gesamtkosten in €</th></tr>";

                while(i<=12){
				
				//vAusgabeHtml = "Die optimale Bestellanzahl liegt bei " + vOptBestellanzahlProJahr + " Bestellungen im Jahr.<br><br>";
				
				 
				vAusgabeHtml += "<td>" + i + "</td>";
                vAusgabeHtml += "<td>" + vBestellmenge + "</td>";
                vAusgabeHtml += "<td>" + vBestellkosten + "</td>";
                vAusgabeHtml += "<td>" + vLagerkosten + "</td>";
                vAusgabeHtml += "<td>" + vGesamtkosten + "</td>";
				
				// Ergänze hier das Programm....		

				

                i++;
                }
				
				vAusgabeHtml = vAusgabeHtml + "</table>";
				
				document.getElementById("idAusgabeHtml").innerHTML = vAusgabeHtml;
				
			}

			
		
		</script>
	</head>

	<body>
		<h1>Optimale Bestellanzahl</h1>
		
		Bestellkosten pro Bestellung: <input id="idBestellkostenProBestellung" type="text" value="40"> €<br>
		Durchschnittliche Lagerkosten pro Drucker: <input id="idLagerkostenProDrucker" type="text" value="0.30"> €<br>
		Jährliche Bestellmenge: <input id="idJaehrlicheBestellmenge" type="text" value="1200"> Drucker<br><br>
		
		<button onclick="fOptimaleMenge();">Analyse der Gesamtkosten</button><br><br>
		
		<div id="idAusgabeHtml"></div>
		
	
</body></html>
